name: CI

on:
  push:
    branches: [ main, ocr-refactor ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/math_app_test
      MONGODB_DB_NAME: math_app_test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm ci
      - name: Start API server
        run: |
          npm start > /tmp/server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          cat /tmp/server.log
          exit 1
      - name: Run tests
        run: npm test
